<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Series Explorer — Stationarity, MA(1), AR(1) & Differencing</title>
  <meta name="description" content="Interactive lecture walkthrough of time series concepts">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-startup">
  <header class="header-bar">
    <span class="header-title">Time Series Explorer</span>
    <button class="btn-mute" id="mute-toggle" aria-label="Toggle sound">🔊</button>
  </header>

  <!-- Removed Preload Overlay -->

  <main class="app-layout" id="app-layout">
    <!-- Charts fill the screen -->
    <section class="canvas-zone" id="canvas-zone">
    </section>

    <!-- Narration subtitle bar with Interactive Input -->
    <aside class="narration-overlay" id="narration-panel">
      <div class="orb-container" id="orb-container">
        <div class="orb" id="orb"></div>
      </div>
      <div class="narration-overlay__inner">
        <div class="narration-scene-title" id="scene-title"></div>
        <div class="narration-text" id="narration-text"></div>
        
        <!-- Interactive Interrupt Bar -->
        <div class="interrupt-bar" id="interrupt-bar">
          <input type="text" id="interrupt-input" placeholder="Interrupt the tutor... (Ask a question)" autocomplete="off">
          <button id="btn-ask">Ask</button>
        </div>
      </div>
    </aside>
  </main>

  <nav class="nav-bar" id="nav-bar" style="justify-content: center;">
    <button class="nav-btn nav-btn--primary" id="btn-play-pause" style="width: 120px; font-weight: bold;">▶ Start Video</button>
  </nav>

  <!-- Hidden continue button for narrator.js compatibility -->
  <button id="btn-continue" style="display:none"></button>

  <script type="module" src="js/main.js"></script>
</body>
</html>
